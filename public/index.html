<!DOCTYPE html>
<html>

    <meta charset="utf-8">
    <title>Player Aid</title>
    <script>
      var lang = navigator.language.slice(0, 2);
      var supported = ['uk', 'en', 'ru'];
      var target = supported.includes(lang) ? lang : 'uk';
      var basePath = window.location.pathname.replace(/\/$/, '');
      window.location.replace(basePath + '/' + target);
    </script>
